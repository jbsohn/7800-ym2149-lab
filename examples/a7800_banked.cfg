# ca65 / ld65 linker configuration for 256KB banked Atari 7800 ROMs (Mapper 1)

MEMORY {
    ZP:       file = "", start = $0080, size = $0080, type = rw, define = yes;
    RAM:      file = "", start = $1800, size = $0800, type = rw, define = yes;
    BANK0:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK1:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK2:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK3:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK4:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK5:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK6:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK7:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK8:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK9:    file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK10:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK11:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK12:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    BANK13:   file = %O, start = $4000, size = $4000, fill = yes, fillval = $FF;
    FIXED:    file = %O, start = $8000, size = $7FF8, fill = yes, fillval = $FF;
    HEADER:   file = %O, start = $FFF8, size = $0002, fill = yes, fillval = $FF;
    VECTORS:  file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    BANK0:    load = BANK0,   type = ro;
    BANK1:    load = BANK1,   type = ro;
    BANK2:    load = BANK2,   type = ro;
    BANK3:    load = BANK3,   type = ro;
    BANK4:    load = BANK4,   type = ro;
    BANK5:    load = BANK5,   type = ro;
    BANK6:    load = BANK6,   type = ro;
    BANK7:    load = BANK7,   type = ro;
    BANK8:    load = BANK8,   type = ro;
    BANK9:    load = BANK9,   type = ro;
    BANK10:   load = BANK10,  type = ro;
    BANK11:   load = BANK11,  type = ro;
    BANK12:   load = BANK12,  type = ro;
    BANK13:   load = BANK13,  type = ro;
    CODE:     load = FIXED,   type = ro;
    RODATA:   load = FIXED,   type = ro;
    FOOTER:   load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
