# ca65 / ld65 linker configuration for 32KB fixed Atari 7800 ROMs

MEMORY {
    ZP:       file = "", start = $0080, size = $0080, type = rw, define = yes;
    RAM:      file = "", start = $1800, size = $0800, type = rw, define = yes;
    ROM:      file = %O, start = $8000, size = $7FF8, fill = yes, fillval = $FF;
    HEADER:   file = %O, start = $FFF8, size = $0002, fill = yes, fillval = $FF;
    VECTORS:  file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    FOOTER:   load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
